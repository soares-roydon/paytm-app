name: Build and Deploy to Docker Hub

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.user
          push: true
          tags: r0yd0n/paytm-app:latest

      - name: Verify Pushed Image
        run: docker pull r0yd0n/paytm-app:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with: 
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          scripts: |
            sudo docker pull r0yd0n/paytm-app:latest
            sudo docker stop paytm-app || true
            sudo docker rm paytm-app || true
            sudo docker run -d --name paytm-app -p 3005:3000 r0yd0n/paytm-app:latest